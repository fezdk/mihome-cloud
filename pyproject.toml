[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mihome-cloud"
version = "0.2.0"
description = "Minimal Xiaomi MiHome cloud client for controlling MIoT smart home devices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nezar Nielsen"},
]
keywords = ["xiaomi", "mihome", "miot", "smart-home", "iot", "vacuum", "dreame"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.28",
    "pycryptodome>=3.15",
]

[project.urls]
Homepage = "https://github.com/fezdk/mihome-cloud"
Repository = "https://github.com/fezdk/mihome-cloud"
Issues = "https://github.com/fezdk/mihome-cloud/issues"
